name: local_storage_demo
description: "Implementation of local storage using Hive, SharedPreferences and SQLite"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  hive_ce: ^2.9.0
  hive_ce_flutter: ^2.1.0
  json_annotation: ^4.9.0
  provider: ^6.1.2
  shared_preferences: ^2.4.0

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^4.0.0
  hive_ce_generator: ^1.8.1

  flutter_test:
    sdk: flutter
  json_serializable: ^6.9.0

