name: local_storage_demo
description: "Implementation of local storage using Hive, SharedPreferences and SQLite"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
    sdk: ^3.5.4

dependencies:
    flutter:
        sdk: flutter

    cupertino_icons: ^1.0.8
    shared_preferences: ^2.4.0
    hive: ^2.2.3
    sqflite: ^2.4.1
    provider: ^6.1.2
    http: ^1.3.0
    

dev_dependencies:
    flutter_test:
        sdk: flutter

    json_serializable: ^6.9.0
    build_runner: ^2.4.13
    flutter_lints: ^4.0.0

